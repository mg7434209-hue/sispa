<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" role="img" aria-label="SİSPA — Su Isıtma Sistemleri Pazarlama">
  <defs>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9A03F"/>
      <stop offset="1" stop-color="#E86A17"/>
    </linearGradient>
  </defs>

  <!-- İkon: güneş paneli + S + sıcak su damlası -->
  <g transform="translate(10,10)">
    <!-- dış halka: sol-alt lacivert, sağ-üst turuncu -->
    <path d="M75 4 A71 71 0 0 0 12 108" fill="none" stroke="#134B70" stroke-width="11" stroke-linecap="round"/>
    <path d="M85 4 A71 71 0 0 1 143 112" fill="none" stroke="#EE7A1F" stroke-width="11" stroke-linecap="round"/>
    <path d="M22 122 A71 71 0 0 0 132 124" fill="none" stroke="#134B70" stroke-width="11" stroke-linecap="round"/>
    <!-- panel ızgarası -->
    <g transform="translate(34,18) skewX(-12)">
      <rect x="0" y="0" width="78" height="30" rx="3" fill="#134B70"/>
      <g stroke="#fff" stroke-width="2.6">
        <line x1="0" y1="10" x2="78" y2="10"/>
        <line x1="0" y1="20" x2="78" y2="20"/>
        <line x1="16" y1="0" x2="16" y2="30"/>
        <line x1="32" y1="0" x2="32" y2="30"/>
        <line x1="48" y1="0" x2="48" y2="30"/>
        <line x1="64" y1="0" x2="64" y2="30"/>
      </g>
    </g>
    <!-- S hattı -->
    <path d="M104 58 H56 q-14 0 -14 13 q0 13 14 13 H92 q14 0 14 14 q0 14 -14 14 H38"
          fill="none" stroke="#134B70" stroke-width="12" stroke-linecap="round"/>
    <!-- buhar -->
    <g stroke="#EE7A1F" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9">
      <path d="M112 62 q4 -7 0 -13"/>
      <path d="M122 64 q4 -7 0 -13"/>
    </g>
    <!-- damla -->
    <path d="M117 74 q16 24 16 36 a16 16 0 0 1 -32 0 q0 -12 16 -36z" fill="url(#dropGrad)"/>
  </g>

  <!-- Yazı markası -->
  <g font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-weight="800">
    <text x="185" y="98" font-size="78" letter-spacing="2">
      <tspan fill="#134B70">S&#304;</tspan><tspan fill="#EE7A1F">SPA</tspan>
    </text>
    <!-- dalga -->
    <path d="M448 88 q18 -14 36 -4 q14 8 28 -2 q-12 16 -32 10 q-16 -5 -32 -4z" fill="#134B70"/>
    <text x="187" y="128" font-size="19.5" font-weight="600" fill="#134B70" letter-spacing="1.1">SU ISITMA S&#304;STEMLER&#304; PAZARLAMA</text>
  </g>
</svg>
